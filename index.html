<style>
  @font-face {
    font-family: "Rethink Sans";
    src: url("fonts/RethinkSans-Variable.woff2") format("woff2");
    font-weight: 400 800;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Instrument Sans";
    src: url("fonts/InstrumentSans-Variable.woff2") format("woff2");
    font-weight: 400 700;
    font-stretch: 75% 100%;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --bg: #121211;
    --fg: #ffffff;
    --muted: rgba(255, 255, 255, 0.7);
    --faint: rgba(255, 255, 255, 0.45);
    --line: rgba(255, 255, 255, 0.12);
    --pad: clamp(20px, 2.3vw, 30px);
    --max: 1280px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 var(--pad); }

  /* Hero */
  .hero {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 96px var(--pad);
  }
  .logo { width: clamp(220px, 34vw, 440px); }
  .logo svg { display: block; width: 100%; height: auto; }
  .tagline {
    margin-top: clamp(28px, 3.5vw, 40px);
    max-width: 34em;
    text-wrap: balance;
  }
  /* ds-text-b20 + w-secondary */
  .b20 {
    font-size: 20px;
    line-height: 1.28;
    letter-spacing: -0.01em;
    color: var(--muted);
  }

  .tagline.soon { max-width: none; }
  /* Subheader reveal after the logo animation */
  .rise { opacity: 0; transform: translateY(10px); transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1); }
  .in .rise { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .rise { opacity: 1; transform: none; transition: none; }
  }

<body>

<main class="hero">
  <h1 class="logo" aria-label="MEGA">
    <svg viewBox="0 0 552 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <!-- M build: each vertical block rises from the baseline; the middle and
             last blocks then extend their horizontal step left to meet the block before -->
        <clipPath id="m-clip">
          <rect id="m-up1"   x="-1"      width="44.4"   y="120" height="0"/>
          <rect id="m-up2"   x="56.958"  width="43.4"   y="120" height="0"/>
          <rect id="m-left2" x="57.46"   width="0"      y="20"  height="37.646"/>
          <rect id="m-up3"   x="113.916" width="41"     y="120" height="0"/>
          <rect id="m-left3" x="114.416" width="0"      y="-1"  height="30.073"/>
        </clipPath>
        <!-- Left-to-right wipe for EGA -->
        <clipPath id="ega-clip">
          <rect id="wipe" x="160" y="0" width="0" height="120"/>
        </clipPath>
      </defs>
      <g fill="#FFFFFF">
        <path id="m" clip-path="url(#m-clip)" d="M153.419 120H113.916V28.573H100.117V120H56.9576V57.1461H43.1587V120H0V57.1461H28.4788V28.573H85.4372V0H153.419V120Z"/>
        <g clip-path="url(#ega-clip)">
          <path d="M283.924 32.1808H210.377V45.8046H283.924V74.1954H210.377V87.8999H283.924V120H167.219V0H283.924V32.1808Z"/>
          <path d="M417.826 0V28.3901H340.61V85.1632H381.273V71.3415H354.409V42.3661H417.826V120H297.451V0H417.826Z"/>
          <path fill-rule="evenodd" clip-rule="evenodd" d="M552 120H508.841V69.8052H474.784V120H431.625V0H552V120ZM474.784 41.4143H508.841V28.3901H474.784V41.4143Z"/>
        </g>
      </g>
    </svg>
  </h1>
  <p class="tagline soon b20 rise">Coming soon</p>
</main>

<script>
(function () {
  var wipe = document.getElementById('wipe');
  var WIPE_W = 392;

  // Steps wipe left together once all three blocks are up (block 3 lands at 1120ms).
  var STEPS_START = 1120, STEPS_DUR = 520;

  // M build: blocks 1-3 rise in turn, then steps 2 and 3 wipe left together.
  // "up" rects rise from the baseline to `to` (a y value); "left" rects grow
  // leftward from their right edge `from` to `to` (an x value). Times in ms.
  var parts = [
    // Every part stops exactly at the logo's edge so no motion is cut off mid-move.
    { id: 'm-up1',   dir: 'up',   to: 57.146,  start: 200,  dur: 440, ease: 'out' },
    { id: 'm-up2',   dir: 'up',   to: 28.573,  start: 420,  dur: 460, ease: 'out' },
    { id: 'm-up3',   dir: 'up',   to: 0,       start: 640,  dur: 480, ease: 'out' },
    { id: 'm-left2', dir: 'left', from: 57.46,   to: 28.479, start: STEPS_START, dur: STEPS_DUR, ease: 'inOut' },
    { id: 'm-left3', dir: 'left', from: 114.416, to: 85.437, start: STEPS_START, dur: STEPS_DUR, ease: 'inOut' }
  ];
  parts.forEach(function (p) { p.el = document.getElementById(p.id); });

  function setPart(p, k) {
    if (p.dir === 'up') {
      var h = (120 - p.to) * k;
      p.el.setAttribute('y', 120 - h); p.el.setAttribute('height', h);
    } else {
      var w = (p.from - p.to) * k;
      p.el.setAttribute('x', p.from - w); p.el.setAttribute('width', w);
    }
  }
  function finish() {
    parts.forEach(function (p) { setPart(p, 1); });
    document.getElementById('m').removeAttribute('clip-path'); // crisp final edges
    wipe.setAttribute('width', WIPE_W);
    document.body.classList.add('in');
  }

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { finish(); return; }

  var easeOut = function (t) { return 1 - Math.pow(1 - t, 3); };
  var easeInOutSine = function (t) { return -(Math.cos(Math.PI * t) - 1) / 2; };
  var easeInOut = function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };

  // EGA wipes in alongside the steps
  var WIPE_START = STEPS_START, WIPE_DUR = 750;
  var t0 = null, textShown = false;

  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

  function frame(now) {
    if (t0 === null) t0 = now;
    var t = now - t0;
    parts.forEach(function (p) {
      var k = clamp01((t - p.start) / p.dur);
      setPart(p, p.ease === 'inOut' ? easeInOutSine(k) : easeOut(k));
    });
    var w = easeInOut(clamp01((t - WIPE_START) / WIPE_DUR));
    wipe.setAttribute('width', WIPE_W * w);
    if (!textShown && t > WIPE_START + WIPE_DUR * 0.6) { document.body.classList.add('in'); textShown = true; }
    if (t < WIPE_START + WIPE_DUR) requestAnimationFrame(frame); else finish();
  }
  requestAnimationFrame(frame);

})();
</script>
