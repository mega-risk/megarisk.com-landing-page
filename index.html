<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mega</title>
<meta name="description" content="Mega builds and backs specialist insurance companies.">
<meta name="theme-color" content="#121211">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 160'%3E%3Cstyle%3Epath%7Bfill:%23000%7D@media (prefers-color-scheme:dark)%7Bpath%7Bfill:%23fff%7D%7D%3C/style%3E%3Cg transform='translate(15 29.159) scale(0.84735)'%3E%3Cpath d='M153.419 120H113.916V28.573H100.117V120H56.9576V57.1461H43.1587V120H0V57.1461H28.4788V28.573H85.4372V0H153.419V120Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preload" href="fonts/InstrumentSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Rethink Sans";
    src: url("fonts/RethinkSans-Variable.woff2") format("woff2");
    font-weight: 400 800;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Instrument Sans";
    src: url("fonts/InstrumentSans-Variable.woff2") format("woff2");
    font-weight: 400 700;
    font-stretch: 75% 100%;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --bg: #121211;
    --fg: #ffffff;
    --muted: rgba(255, 255, 255, 0.7);
    --faint: rgba(255, 255, 255, 0.45);
    --pad: clamp(20px, 2.3vw, 30px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100svh;
  }
  a { color: inherit; text-decoration: none; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 96px var(--pad);
  }
  .logo { width: clamp(220px, 34vw, 440px); }
  .logo svg { display: block; width: 100%; height: auto; }
  /* Matches the draft site's ds-text-b20 + w-secondary */
  h1 {
    margin-top: clamp(28px, 3.5vw, 40px);
    font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    font-weight: 400;
    font-size: 20px;
    line-height: 1.28;
    letter-spacing: -0.01em;
    color: var(--muted);
    text-wrap: balance;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    height: 44px;
    margin-top: 36px;
    padding: 0 22px;
    border-radius: 100px;
    background: var(--fg);
    color: var(--bg);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0;
    transition: opacity 0.2s ease;
  }
  .pill:hover { opacity: 0.85; }

  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    padding: 0 var(--pad);
    color: var(--faint);
    font-size: 13px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  footer a:hover { color: var(--fg); }

  /* Text reveal after the logo animation */
  .rise { opacity: 0; transform: translateY(10px); transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1); }
  .in .rise { opacity: 1; transform: none; }
  .in .rise.d2 { transition-delay: 0.15s; }
  .in footer.rise { transition-delay: 0.3s; }
</style>
</head>
<body>

<main>
  <h2 class="logo" aria-label="Mega">
    <svg viewBox="0 0 552 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <!-- Three steps of the M, each rises from the baseline -->
        <clipPath id="m-clip">
          <rect class="step" x="0"      width="28.48"  y="120" height="0"/>
          <rect class="step" x="27.98"  width="57.46"  y="120" height="0"/>
          <rect class="step" x="84.94"  width="68.48"  y="120" height="0"/>
        </clipPath>
        <!-- Left-to-right wipe for EGA -->
        <clipPath id="ega-clip">
          <rect id="wipe" x="160" y="0" width="0" height="120"/>
        </clipPath>
      </defs>
      <g fill="#FFFFFF">
        <path clip-path="url(#m-clip)" d="M153.419 120H113.916V28.573H100.117V120H56.9576V57.1461H43.1587V120H0V57.1461H28.4788V28.573H85.4372V0H153.419V120Z"/>
        <g clip-path="url(#ega-clip)">
          <path d="M283.924 32.1808H210.377V45.8046H283.924V74.1954H210.377V87.8999H283.924V120H167.219V0H283.924V32.1808Z"/>
          <path d="M417.826 0V28.3901H340.61V85.1632H381.273V71.3415H354.409V42.3661H417.826V120H297.451V0H417.826Z"/>
          <path fill-rule="evenodd" clip-rule="evenodd" d="M552 120H508.841V69.8052H474.784V120H431.625V0H552V120ZM474.784 41.4143H508.841V28.3901H474.784V41.4143Z"/>
        </g>
      </g>
    </svg>
  </h2>
  <h1 class="rise">Specialist insurance, built to last.</h1>
  <a class="pill rise d2" href="mailto:hello@megarisk.com">Contact us</a>
</main>

<footer class="rise">
  <span>&copy; <span id="yr">2026</span> Mega Risk, LLC</span>
  <a href="mailto:hello@megarisk.com">hello@megarisk.com</a>
</footer>

<script>
(function () {
  document.getElementById('yr').textContent = new Date().getFullYear();

  var steps = document.querySelectorAll('#m-clip .step');
  var wipe = document.getElementById('wipe');
  var WIPE_W = 392;

  function setStep(r, p) { var h = 120 * p; r.setAttribute('y', 120 - h); r.setAttribute('height', h); }
  function finish() {
    steps.forEach(function (r) { setStep(r, 1); });
    wipe.setAttribute('width', WIPE_W);
    document.body.classList.add('in');
  }

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { finish(); return; }

  var easeOut = function (t) { return 1 - Math.pow(1 - t, 3); };
  var easeInOut = function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };

  // Timeline (ms)
  var DELAY = 250, STEP_DUR = 420, STEP_GAP = 160;
  var WIPE_START = DELAY + STEP_GAP * 2 + STEP_DUR + 80, WIPE_DUR = 750;
  var t0 = null, textShown = false;

  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

  function frame(now) {
    if (t0 === null) t0 = now;
    var t = now - t0;
    steps.forEach(function (r, i) {
      setStep(r, easeOut(clamp01((t - DELAY - i * STEP_GAP) / STEP_DUR)));
    });
    var w = easeInOut(clamp01((t - WIPE_START) / WIPE_DUR));
    wipe.setAttribute('width', WIPE_W * w);
    if (!textShown && t > WIPE_START + WIPE_DUR * 0.6) { document.body.classList.add('in'); textShown = true; }
    if (t < WIPE_START + WIPE_DUR) requestAnimationFrame(frame); else finish();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
